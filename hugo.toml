[params]
  description = 'Oak Ridges Advisory helps organisations build and grow across Southeast Asia in financial services, energy, and food and agriculture.'
  companyName = 'Oak Ridges Advisory'
  legalName = 'Oak Ridges Advisory'
  tagline = 'Southeast Asian markets. Canadian roots. Operator experience.'
  headingFont = 'serif'
  primaryColor = '#1f5a45'
  primaryColorDark = '#b28a45'
  defaultScheme = 'system'
  showSchemeToggle = true
  showBreadcrumbs = true
  showReadingTime = false
  showRelated = true

  [params.seo]
    titleSeparator = '·'
    organizationType = 'ProfessionalService'

  [params.cta]
    eyebrow = 'Start a conversation'
    title = 'A market question, a venture, or a transition to lead?'
    text = 'Tell us what you are trying to build or change. We will be direct about where our experience can help.'
    primaryLabel = 'Contact Oak Ridges'
    primaryURL = '/contact/'

  [params.footer]
    text = 'Independent advisory for organisations building across Southeast Asia.'

  [params.analytics]
    plausibleDomain = ''
    googleAnalyticsID = ''

  [params.contactForm]
    action = ''
    method = 'POST'
    netlify = false
