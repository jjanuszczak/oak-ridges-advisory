- title: "Frame the decision"
  text: "Agree on the business question, the decision owner, and what evidence would change the course."
  duration: "Start"
- title: "Assess the ground"
  text: "Review the market, operating model, stakeholder landscape, and capabilities needed to move."
  duration: "Assess"
- title: "Set the direction"
  text: "Define practical options, priorities, and the conditions that make each option viable."
  duration: "Decide"
- title: "Support execution"
  text: "Work with the team and partners to turn the agreed direction into action and learn from progress."
  duration: "Act"
